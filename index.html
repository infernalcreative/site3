<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Что-то пошло не так</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --fg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      transition: background-color 0.25s ease, color 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: flex-end;
      padding: 1rem 1.5rem;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--fg);
      color: var(--fg);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .theme-toggle:hover {
      transform: rotate(15deg);
      opacity: 0.8;
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
    }

    /* Показываем иконку, противоположную текущей теме */
    .icon-sun  { display: none; }
    .icon-moon { display: block; }

    [data-theme="dark"] .icon-sun  { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1.5rem;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw + 1rem, 3rem);
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <header>
    <button
      class="theme-toggle"
      type="button"
      aria-label="Переключить тему"
      title="Переключить тему"
    >
      <!-- Луна (показывается на светлой теме — переключить на тёмную) -->
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <!-- Солнце (показывается на тёмной теме — переключить на светлую) -->
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2"  x2="12" y2="4"/>
        <line x1="12" y1="20" x2="12" y2="22"/>
        <line x1="4.93" y1="4.93"  x2="6.34" y2="6.34"/>
        <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
        <line x1="2"  y1="12" x2="4"  y2="12"/>
        <line x1="20" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/>
        <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
      </svg>
    </button>
  </header>

  <main>
    <h1>Что-то пошло не так</h1>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const STORAGE_KEY = 'theme';

      // Восстанавливаем сохранённую тему, иначе учитываем системные настройки
      const saved = localStorage.getItem(STORAGE_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initial = saved || (prefersDark ? 'dark' : 'light');
      root.setAttribute('data-theme', initial);

      document.querySelector('.theme-toggle').addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem(STORAGE_KEY, next);
      });
    })();
  </script>
</body>
</html>
